<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal CI</title>
<style>
:root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --line:#e7e5e4; --card:#fff; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --line:#292524; --card:#1c1917; --accent:#2dd4bf; --warn:#f59e0b; --bad:#f87171; } }
* { box-sizing:border-box; } body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
header { padding:16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; } nav button { background:none; border:0; color:var(--muted); padding:6px 10px; cursor:pointer; font:inherit; }
nav button.on { color:var(--fg); border-bottom:2px solid var(--accent); } main { max-width:980px; margin:0 auto; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; }
input, textarea, select { width:100%; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
textarea { min-height:80px; } button.act { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font:inherit; }
button.ghost { background:none; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .muted { color:var(--muted); font-size:13px; }
table { width:100%; border-collapse:collapse; font-size:14px; } td, th { text-align:left; padding:6px; border-bottom:1px solid var(--line); vertical-align:top; }
pre { white-space:pre-wrap; word-break:break-word; font-size:13px; } .tag { font-size:12px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); }
.warn { color:var(--warn); } .bad { color:var(--bad); } .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Personal CI</h1>
  <nav id="tabs"></nav>
  <span style="flex:1"></span>
  <input id="token" type="password" placeholder="API token" style="max-width:260px">
</header>
<main id="main"></main>
<script>
const tabs = ["Ask", "Memory", "Consent", "Receipts", "Learning", "Audit"];
let tab = "Ask";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
try { $("#token").value = sessionStorage.getItem("pcim_token") || ""; } catch (e) {}
$("#token").addEventListener("change", e => { try { sessionStorage.setItem("pcim_token", e.target.value); } catch (_) {} render(); });
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Authorization": "Bearer " + $("#token").value, "Content-Type": "application/json" },
                                body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail ? JSON.stringify(j.detail) : r.status);
  return j;
}
function nav() { $("#tabs").innerHTML = tabs.map(t => `<button class="${t===tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join(""); }
async function render() {
  nav(); const m = $("#main");
  if (!$("#token").value) { m.innerHTML = `<div class="card">Paste the API token printed by <code>pcim init</code>.</div>`; return; }
  try { m.innerHTML = await views[tab](); } catch (e) { m.innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}
const views = {
  async Ask() {
    return `<div class="card"><textarea id="task" placeholder="Ask anything"></textarea>
      <div class="row" style="margin-top:8px"><select id="prov" style="max-width:160px"><option>mock</option><option>anthropic</option><option>openai</option><option>google</option><option>local</option></select>
      <input id="model" placeholder="model (optional)" style="max-width:220px">
      <select id="mode" style="max-width:160px"><option value="">mode: learned</option><option>direct</option><option>explain</option><option>hint_first</option><option>socratic</option><option>verify_only</option></select>
      <button class="act" onclick="doAsk()">Ask</button></div></div><div id="answer"></div>`;
  },
  async Memory() {
    const items = await api("GET", "/v1/memory");
    const rows = items.map(i => `<tr><td><span class="tag">${esc(i.kind)}</span> ${i.pinned?"📌":""}</td><td>${esc(i.content)}
      ${i.flags.includes("contains_instructions")?'<div class="warn muted">contains instruction-like text — withheld until confirmed</div>':""}
      ${i.flags.includes("conflicted")?'<div class="warn muted">conflicts with another note</div>':""}
      <div class="muted">${esc(i.source)} · ${esc(i.trust)} · ${esc(i.sensitivity)} · since ${esc((i.valid_from||"").slice(0,10))}</div></td>
      <td class="row"><button class="ghost" onclick="act('POST','/v1/memory/${i.id}/pin?pinned=${!i.pinned}')">${i.pinned?"unpin":"pin"}</button>
      <button class="ghost" onclick="act('POST','/v1/memory/${i.id}/confirm')">confirm</button>
      <button class="ghost" onclick="act('POST','/v1/memory/${i.id}/retract')">retract</button>
      <button class="ghost bad" onclick="if(confirm('Delete permanently? The key is destroyed; this cannot be undone.'))act('DELETE','/v1/memory/${i.id}')">delete</button></td></tr>`).join("");
    return `<div class="card"><div class="row"><input id="mem" placeholder="Tell CI something about you" style="flex:1">
      <select id="kind" style="max-width:150px"><option>fact</option><option>preference</option><option>constraint</option><option>goal</option><option>skill</option><option>episode</option></select>
      <button class="act" onclick="addMem()">Remember</button></div></div>
      <div class="card"><table><tr><th>kind</th><th>item</th><th></th></tr>${rows || '<tr><td colspan=3 class="muted">Nothing yet.</td></tr>'}</table></div>`;
  },
  async Consent() {
    const gs = await api("GET", "/v1/consent");
    return `<div class="card"><p class="muted">Nothing reaches a model provider without a grant here. Revocation is immediate.</p><table><tr><th>source</th><th>purpose</th><th>provider</th><th>ceiling</th><th></th></tr>
      ${gs.map(g => `<tr><td>${esc(g.source)}</td><td>${esc(g.purpose)}</td><td>${esc(g.provider)}</td><td>${esc(g.max_sensitivity)}</td>
      <td>${g.active?`<button class="ghost" onclick="act('DELETE','/v1/consent/${g.id}')">revoke</button>`:'<span class="muted">revoked</span>'}</td></tr>`).join("")}</table></div>`;
  },
  async Receipts() {
    const xs = (await api("GET", "/v1/interactions")).reverse().slice(0, 50);
    return `<div class="card"><table><tr><th>when</th><th>provider</th><th>notes sent</th><th>cost</th><th>reward</th></tr>
      ${xs.map(x => `<tr><td><a href="#" onclick="showReceipt('${x.id}');return false">${esc(x.ts.slice(0,19))}</a></td><td>${esc(x.provider)}/${esc(x.model)}</td>
      <td>${x.selected.length}</td><td>${x.cost_usd==null?'<span class="warn">unknown</span>':'$'+x.cost_usd.toFixed(5)}</td><td>${x.reward==null?"—":x.reward.toFixed(2)}</td></tr>`).join("")}</table></div><div id="rc"></div>`;
  },
  async Learning() {
    const [mt, dna] = await Promise.all([api("GET", "/v1/metrics"), api("GET", "/v1/dna")]);
    return `<div class="card"><b>Metrics</b><p class="muted">${esc(mt.caveat)}</p><pre>${esc(JSON.stringify({interactions: mt.interactions, with_feedback: mt.with_feedback, mean_reward: mt.mean_reward, reward_curve_per_10: mt.reward_curve_per_10, by_provider: mt.by_provider}, null, 1))}</pre></div>
      <div class="card"><b>Intelligence DNA</b><pre>${esc(JSON.stringify(dna, null, 1))}</pre></div>`;
  },
  async Audit() {
    const a = await api("GET", "/v1/audit?limit=200");
    return `<div class="card">Chain ${a.chain_ok?'<b>verified</b>':'<b class="bad">BROKEN at '+a.first_bad_seq+'</b>'} · head <code>${esc(a.head.slice(0,16))}…</code>
      <table>${a.entries.reverse().map(e => `<tr><td class="muted">${esc(e.ts.slice(0,19))}</td><td>${esc(e.event)}</td><td><pre>${esc(JSON.stringify(e.payload))}</pre></td></tr>`).join("")}</table></div>`;
  },
};
async function act(method, path) { try { await api(method, path); render(); } catch (e) { alert(e.message); } }
async function addMem() { await api("POST", "/v1/memory", { content: $("#mem").value, kind: $("#kind").value }); render(); }
async function doAsk() {
  const out = $("#answer"); out.innerHTML = `<div class="card muted">…</div>`;
  try {
    const r = await api("POST", "/v1/ask", { task: $("#task").value, provider: $("#prov").value, model: $("#model").value || null, assist_mode: $("#mode").value || null });
    out.innerHTML = `<div class="card"><pre>${esc(r.text)}</pre><div class="row">
      ${[1,2,3,4,5].map(n => `<button class="ghost" onclick="fb('${r.interaction_id}',{rating:${n}})">${n}</button>`).join("")}
      <button class="ghost" onclick="fb('${r.interaction_id}',{task_success:true})">it worked</button>
      <button class="ghost" onclick="fb('${r.interaction_id}',{task_success:false})">it failed</button>
      <button class="ghost" onclick="fb('${r.interaction_id}',{corrected:true})">I had to correct it</button></div></div>
      <div class="card"><b>Context receipt</b> — exactly what was sent to ${esc(r.receipt.provider)}<pre>${esc(JSON.stringify(r.receipt, null, 1))}</pre></div>`;
  } catch (e) { out.innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}
async function fb(id, s) { const r = await api("POST", "/v1/feedback/" + id, s); alert("Recorded. Reward " + (r.reward == null ? "none" : r.reward.toFixed(2))); }
async function showReceipt(id) { const r = await api("GET", "/v1/interactions/" + id); $("#rc").innerHTML = `<div class="card"><pre>${esc(JSON.stringify(r, null, 1))}</pre></div>`; }
render();
</script>
</body>
</html>
